name: Price refresh (hourly)

on:
  schedule:
    - cron: "35 * * * 1-5"   # every hour on weekdays: covers Asian, European and US sessions
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LS_DATA_DIR: site/data
      LS_CACHE_DIR: site/cache
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt

      - name: Load the last published data
        id: load
        run: |
          if ! git ls-remote --exit-code --heads origin gh-pages >/dev/null; then
            echo "No published data yet. Run the Full screen workflow first."; echo "skip=1" >> "$GITHUB_OUTPUT"; exit 0
          fi
          git clone --depth 1 --branch gh-pages "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" site
          rm -rf site/.git

      - name: Refresh prices
        if: steps.load.outputs.skip != '1'
        run: python screener.py prices

      - name: Publish
        if: steps.load.outputs.skip != '1'
        run: |
          cp docs/index.html docs/style.css docs/app.js site/
          touch site/.nojekyll
          cd site
          git init -q -b gh-pages
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add -A
          git commit -qm "Prices $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages
