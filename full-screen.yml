name: Full screen (daily)

on:
  schedule:
    - cron: "45 21 * * 1-5"   # 21:45 UTC on weekdays, after the US close
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  screen:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt pytest
      - run: python -m pytest -q tests
      - run: python screener.py full
      - name: Commit results
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add docs/data cache
          git diff --cached --quiet && exit 0
          git commit -m "Full screen $(date -u +%Y-%m-%d)"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && exit 0; sleep $((i*5)); done
          exit 1
