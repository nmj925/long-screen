name: Price refresh (hourly)

on:
  schedule:
    - cron: "35 13-20 * * 1-5"   # hourly through the US session (UTC)
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: screener-data
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresh prices
        run: |
          if grep -q '"demo":true' docs/data/screen.json 2>/dev/null; then
            echo "Still on sample data. Run the Full screen workflow first."; exit 0
          fi
          python screener.py prices
      - name: Commit results
        run: |
          git config user.name "screener-bot"
          git config user.email "screener-bot@users.noreply.github.com"
          git add docs/data
          git diff --cached --quiet && exit 0
          git commit -m "Prices $(date -u +%Y-%m-%dT%H:%MZ)"
          for i in 1 2 3 4; do git pull --rebase -X theirs && git push && exit 0; sleep $((i*5)); done
          exit 1
